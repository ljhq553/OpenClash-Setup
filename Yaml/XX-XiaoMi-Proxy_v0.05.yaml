# XX-XiaoMi-Proxy v0.05，适用于Mihomo内核的OpenClash / Clash Verge Rev等客户端；
# DNS、TUN、端口、外部控制等配置由各客户端分别设置；
# OpenClash 启动前请确认GeoSite / GeoIP 等数据可用；
# 注意：用自己的机场订阅链接和机场名英文简称替换。

# = 机场订阅 =
proxy-providers:
  机场名英文简称:
    url: "你的机场订阅链接"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    exclude-filter: 剩余|距离|套餐|流量|到期
    override:
      additional-prefix: 机场名英文简称-

# = 本地直连代理 =
proxies:
- name: 直连
  type: direct

# = 分流策略组 =
proxy-groups:
- name: Google
  type: select
  proxies:
  - 所有自动
  - 直连
- name: OpenAI
  type: select
  proxies:
  - AI节点组
  - 直连
- name: YouTube
  type: select
  proxies:
  - 所有自动
  - 直连
- name: GitHub
  type: select
  proxies:
  - 所有自动
  - 直连
- name: 国外
  type: select
  proxies:
  - 所有自动
  - 直连
- name: 国内
  type: select
  proxies:
  - 直连
  - 所有自动
- name: 其他
  type: select
  proxies:
  - 所有自动
  - 直连

# = 节点代理组 =
- name: AI节点组
  type: url-test
  use:
  - 机场名英文简称
  filter: (?i)(新加坡|狮城|Singapore|日本|Japan|东京|美国|United States|USA|英国|United Kingdom|Britain|(^|[^A-Za-z])(SG|JP|US|UK)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100

- name: 所有自动
  type: url-test
  use:
  - 机场名英文简称
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100

# = 分流规则 =
rules:
- GEOSITE,private,直连
- IP-CIDR,127.0.0.0/8,直连,no-resolve
- IP-CIDR,169.254.0.0/16,直连,no-resolve
- IP-CIDR,10.0.0.0/8,直连,no-resolve
- IP-CIDR,172.16.0.0/12,直连,no-resolve
- IP-CIDR,192.168.0.0/16,直连,no-resolve
- IP-CIDR,100.64.0.0/10,直连,no-resolve
- IP-CIDR,224.0.0.0/4,直连,no-resolve
- IP-CIDR,240.0.0.0/4,直连,no-resolve

- DOMAIN-SUFFIX,google.com,Google
