# = dns配置 =
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://1.1.1.1/dns-query
  nameserver-policy:
    geosite:cn:
    - https://dns.alidns.com/dns-query#DIRECT
    geosite:geolocation-!cn:
    - https://1.1.1.1/dns-query#所有自动
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query

# = 机场订阅 =
proxy-providers:
  XXdl:
    url: “”
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 180
    exclude-filter: 剩余|距离|套餐|流量|到期
    override:
      additional-prefix: "XX-"

# = 自定义节点 =
proxies:
- name: 直连
  type: direct

- name: 拒绝
  type: reject

# =分流策略组 =
proxy-groups:
- name: YouTube
  type: select
  proxies:
  - 所有自动
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/youtube.svg

- name: Gemini
  type: select
  proxies:
  - 美国自动
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/gemini.svg

- name: OpenAI
  type: select
  proxies:
  - AI专用组
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/chatgpt.svg

- name: Google
  type: select
  proxies:
  - 所有自动
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/google.svg

- name: GitHub
  type: select
  proxies:
  - 所有自动
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/github.svg

- name: 广告拦截
  type: select
  proxies:
  - 拒绝
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/ad.svg

# = 节点分类组 =
- name: 所有自动
  type: url-test
  use:
  - LXdl
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/all-auto.svg

- name: AI专用组
  type: url-test
  use:
  - LXdl
  filter: (?i)(新加坡|狮城|Singapore|日本|Japan|东京|美国|United States|USA|英国|United Kingdom|Britain|(^|[^A-Za-z])(SG|JP|US|UK)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/openai.svg

- name: 美国自动
  type: url-test
  use:
  - LXdl
  filter: (?i)(美国|United States|US|(^|[^A-Za-z])(US)([^A-Za-z]|$))
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 100
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/flags-us.svg

- name: 国外
  type: select
  proxies:
  - 所有自动
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/world.svg

- name: 国内
  type: select
  proxies:
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/home.svg

- name: 其他
  type: select
  proxies:
  - 所有自动
  - 直连
  icon: https://raw.githubusercontent.com/ljhq553/Icon/refs/heads/main/fishing.svg

# = 数据库 Geo 下载与更新 =
geo-auto-update: true
geo-update-interval: 24
geodata-loader: standard
geodata-mode: true
geox-url:
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

# = 路由规则 =
rules:
# = 广告拦截 =
  - GEOSITE,category-ads-all,广告拦截

